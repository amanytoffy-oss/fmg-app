.tabs button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gift{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;position:relative}

.gift b{display:block;font-size:14px}
.gift small{color:var(--muted)}
.badge{position:absolute;top:16px;inset-inline-start:16px;background:var(--pink);color:#fff;font-size:11px;border-radius:10px;padding:2px 8px}
.gift.res .pic{opacity:.45}
.big{font-size:100px;text-align:center;background:var(--soft);border-radius:24px;padding:28px 0;margin-bottom:14px}
.price{display:inline-block;background:var(--soft);color:var(--pink);border-radius:12px;padding:4px 12px;font-weight:700;margin:8px 0}
.story{background:var(--yellow);border-radius:16px;padding:12px;margin:10px 0;line-height:1.7}
.note{color:var(--muted);font-size:13px;line-height:1.7;margin-top:8px}

.sw{display:flex;align-items:center;justify-content:space-between;margin-top:12px}

.wv span{display:inline-block;animation:wavy 1.5s ease-in-out infinite}.wv span:nth-child(2){animation-delay:.15s}.wv span:nth-child(3){animation-delay:.3s}@keyframes wavy{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-12px) rotate(-5deg)}65%{transform:translateY(5px) rotate(4deg)}}@media (prefers-reduced-motion:reduce){.wv span{animation:none}}
.mx{display:inline-block;color:var(--pink);font-weight:700;animation:wavys 1.5s ease-in-out infinite}@keyframes wavys{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-4deg)}65%{transform:translateY(3px) rotate(3deg)}}@media (prefers-reduced-motion:reduce){.mx{animation:none}}

.gb{animation:giftb 1.25s ease-in-out both}
@keyframes giftb{0%{transform:rotate(0) scale(1)}10%{transform:rotate(-9deg) scale(1.03)}20%{transform:rotate(9deg) scale(1.06)}30%{transform:rotate(-11deg) scale(1.08)}40%{transform:rotate(11deg) scale(1.1)}50%{transform:rotate(-8deg) scale(1.12)}60%{transform:rotate(8deg) scale(1.14)}70%{transform:rotate(0) scale(1.18)}78%{transform:scale(1.42)}100%{transform:rotate(0) scale(1)}}
.ring{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:radial-gradient(circle,rgba(255,207,63,.8),rgba(232,69,127,.35) 60%,transparent 70%);opacity:0;animation:ringb 1.5s ease-out .9s forwards}

@keyframes rev{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rev{opacity:1;animation:none}.sp,.ring,.wash{display:none}.gb{animation:none}}

.hero2{background:linear-gradient(135deg,var(--pink),#b06ad8);color:#fff;border-radius:22px;padding:18px;margin-bottom:16px}

.lnk{background:none;border:0;color:var(--pink);font-family:inherit;font-weight:700;cursor:pointer;padding:6px;font-size:14px}
.danger{background:#fde3ea;color:#c4224f}
.res .badge{background:#8d6b80}
.mini{font-size:12px;color:var(--muted)}
.ecard{background:var(--yellow);border-radius:16px;padding:12px;margin:10px 0;line-height:1.8}
.tag{display:inline-block;background:var(--soft);color:var(--pink);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin-inline-end:6px}
.emgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.emgrid button{border:0;background:var(--soft);border-radius:10px;font-size:20px;padding:6px 0;cursor:pointer}
.pricebox{display:flex;align-items:center;gap:8px}.pricebox input{width:90px;text-align:center}
.sheet>div{max-height:88vh;overflow:auto}
a.btn{display:block;text-align:center;text-decoration:none}
</style>

  $('ab').disabled=true;
  var up=S.auth==='up',pr=up?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p});
  pr.then(function(r){
    $('ab').disabled=false;
    if(r.error){S.err=/invalid login/i.test(r.error.message)?'الإيميل أو كلمة المرور غلط':/registered/i.test(r.error.message)?'هذا الإيميل مسجّل، سجّلي دخول':'صار خطأ: '+r.error.message;$('er').textContent=S.err;return}
    S.err='';
    if(up&&!r.data.session){setApp(topbar()+'<div style="text-align:center;padding-top:50px"><div style="font-size:56px">📩</div><h2>تأكدي من إيميلج</h2><p class="note">أرسلنا رابط تفعيل. اضغطيه وبعدها ارجعي سجّلي دخول.</p></div>')}
  });
}

function vOnboard(){
  setApp(topbar()+'<div class="hero2"><div class="big2">✨</div><h2>خطوة أخيرة</h2><p>اختاري اسم ويوزر لرابطج</p></div>'+
  '<label>اسمج (يظهر لأصدقائج)</label><input id="dn" maxlength="30">'+
  '<label>اليوزر (حروف إنجليزية وأرقام و _)</label><input id="un" dir="ltr" style="text-align:left" maxlength="20" placeholder="amani_gifts">'+
  '<div class="err" id="er"></div><button class="btn" onclick="saveProfile()">حفظ</button>');
}
function saveProfile(){
  var d=$('dn').value.trim(),u=$('un').value.trim().toLowerCase();
  if(!d){$('er').textContent='اكتبي اسمج';return}
  if(!/^[a-z0-9_]{3,20}$/.test(u)){$('er').textContent='اليوزر: 3-20 حرف إنجليزي صغير أو رقم أو _';return}
  var isNew=!S.profile,q=isNew?sb.from('profiles').insert({id:S.user.id,username:u,display_name:d}):sb.from('profiles').update({username:u,display_name:d}).eq('id',S.user.id);
  q.then(function(r){
    if(r.error){$('er').textContent=r.error.code==='23505'?'هذا اليوزر مأخوذ، جربي غيره':'صار خطأ: '+r.error.message;return}
    S.profile={id:S.user.id,username:u,display_name:d};toast('تم الحفظ 💗');nav('/')
  });
}

function vHome(){
  var p=S.profile,h=topbar()+'<div class="hero2"><h2>هلا '+esc(p.display_name)+' 💗</h2><p>رابط صفحتج: <span dir="ltr">@'+esc(p.username)+'</span></p>'+
  '<button class="btn alt" style="margin-top:12px" onclick="shareLink(base()+\'#/u/'+esc(p.username)+'\',\'قوائم هدايا '+esc(p.display_name)+'\')">🔗 شاركي صفحتج</button></div>';
  if(!S.lists.length)h+='<div style="text-align:center;padding:24px 0"><div style="font-size:52px">🎀</div><p class="note">ما عندج قوائم بعد. سوّي أول قائمة!</p></div>';
  S.lists.forEach(function(l){h+='<div class="row" onclick="nav(\'/l/'+l.id+'\')"><div class="em">'+esc(l.emoji)+'</div><div><b>'+esc(l.title)+'</b></div></div>'});
  setApp(h+'<button class="btn" onclick="nav(\'/new\')">+ قائمة جديدة</button>');
}

function vNew(){
  S.occ=0;
  var h=topbar()+'<h2 style="margin-bottom:6px">قائمة جديدة</h2><label>المناسبة</label><div class="chips" style="flex-wrap:wrap">';
  OCC.forEach(function(o,i){h+='<button class="chip" id="oc'+i+'" onclick="pickOcc('+i+')" style="'+(i===0?'border-color:var(--pink);background:var(--soft)':'')+'"><b>'+o[0]+'</b>'+o[1]+'</button>'});
  setApp(h+'</div><label>اسم القائمة</label><input id="ln" maxlength="60" placeholder="مثلاً: عيد ميلادي"><div class="err" id="er"></div><button class="btn" onclick="saveList()">إنشاء</button>');
}
function pickOcc(i){S.occ=i;OCC.forEach(function(o,j){var b=$('oc'+j);b.style.borderColor=j===i?'var(--pink)':'';b.style.background=j===i?'var(--soft)':''});var n=$('ln');if(!n.value)n.value=OCC[i][1]==='مناسبة ثانية'?'':OCC[i][1]+' '+esc(S.profile.display_name)}
function saveList(){
  var t=$('ln').value.trim();if(!t){$('er').textContent='اكتبي اسم القائمة';return}
  sb.from('lists').insert({owner:S.user.id,title:t,emoji:OCC[S.occ][0]}).select().single().then(function(r){
    if(r.error){$('er').textContent='صار خطأ: '+r.error.message;return}nav('/l/'+r.data.id)})
}

function vUser(){
  var p=S.pub;
  if(!p){setApp(topbar()+'<div style="text-align:center;padding-top:50px"><div style="font-size:56px">🔎</div><h2>ما لقينا هذا اليوزر</h2></div>');return}
  var h=topbar()+'<div class="hero2"><div class="big2">🎁</div><h2>'+esc(p.profile.display_name)+'</h2><p dir="ltr" style="text-align:right">@'+esc(p.profile.username)+'</p></div>';
  if(!p.lists.length)h+='<p class="note" style="text-align:center">ما عندها قوائم بعد</p>';
  p.lists.forEach(function(l){h+='<div class="row" onclick="nav(\'/l/'+l.id+'\')"><div class="em">'+esc(l.emoji)+'</div><div><b>'+esc(l.title)+'</b></div></div>'});
  setApp(h);
}

function vList(){
  var d=S.data;
  if(!d){setApp(topbar()+'<div style="text-align:center;padding-top:50px"><div style="font-size:56px">🔎</div><h2>القائمة غير موجودة</h2></div>');return}
  var L=d.list,own=d.mine,h=topbar()+'<div class="hero2"><div class="big2">'+esc(L.emoji)+'</div><h2>'+esc(L.title)+'</h2><p>'+(own?'قائمتج':'قائمة '+esc(d.owner?d.owner.display_name:''))+'</p></div>';
  if(own)h+='<div style="display:flex;gap:8px"><button class="btn" style="margin:0" onclick="shareLink(listUrl(\''+L.id+'\'),\''+esc(L.title).replace(/'/g,'')+'\')">🔗 شاركي القائمة</button><button class="btn alt" style="margin:0" onclick="openForm(null)">+ هدية</button></div><div style="height:14px"></div>';
  if(!d.gifts.length)h+='<div style="text-align:center;padding:24px 0"><div style="font-size:52px">🎀</div><p class="note">'+(own?'ما ضفتي هدايا بعد. اضغطي + هدية.':'القائمة فاضية حالياً')+'</p></div>';
  h+='<div class="grid">';
  d.gifts.forEach(function(g){
    h+='<div class="gift'+(g.reserved?' res':'')+'" onclick="openGift(\''+g.id+'\')"><div class="pic">'+esc(g.emoji)+'</div>'+(g.reserved?'<span class="badge">'+(g.received?'تم الاستلام 🎁':'محجوزة 🔒')+'</span>':'')+'<b>'+esc(g.name)+'</b><small>'+fmt(g.price)+'</small></div>';
  });
  h+='</div>';
  if(own)h+='<div style="text-align:center;margin-top:22px"><button class="lnk" style="color:#c4224f" onclick="askDelList()">'+(S.ask==='dl'?'اضغطي مرة ثانية لتأكيد حذف القائمة':'حذف القائمة')+'</button></div>';
  else if(!S.user)h+='<div style="text-align:center;margin-top:24px" class="note">تريدين قائمة هدايا خاصة بيج؟ <button class="lnk" onclick="nav(\'/\')">سوّي حسابج</button></div>';
  setApp(h+modalHTML());
}
function askDelList(){
  if(S.ask!=='dl'){S.ask='dl';vList();return}
  sb.from('lists').delete().eq('id',S.data.list.id).then(function(r){S.ask='';if(r.error)return toast('صار خطأ');toast('تم حذف القائمة');nav('/')})
}
function gOf(id){return (S.data.gifts||[]).filter(function(g){return g.id===id})[0]}
function openGift(id){S.modal={t:'gift',id:id};S.ask='';S.hours=24;vList()}
function openForm(id){S.modal={t:'form',id:id};vList()}
function closeM(){S.modal=null;S.ask='';vList()}

function modalHTML(){
  var m=S.modal;if(!m)return'';
  var h='<div class="sheet" onclick="if(event.target===this)closeM()"><div>';
  if(m.t==='form'){
    var g=m.id?gOf(m.id):{name:'',emoji:'🎁',price:null,link:'',store:'',story:''};
    h+='<h2>'+(m.id?'تعديل الهدية':'هدية جديدة')+'</h2><label>اسم الهدية *</label><input id="fn" maxlength="100" value="'+esc(g.name)+'">'+
    '<label>أيقونة (اختياري)</label><input id="fe" maxlength="4" value="'+esc(g.emoji)+'" style="text-align:center;font-size:24px"><div class="emgrid">';
    EMS.forEach(function(e){h+='<button type="button" onclick="$(\'fe\').value=\''+e+'\'">'+e+'</button>'});
    h+='</div><label>السعر التقريبي (بالآلاف، اختياري)</label><div class="pricebox"><input id="fp" inputmode="numeric" value="'+(g.price?Math.round(g.price/1000):'')+'" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,6)"><b>,000 د.ع</b></div>'+
    '<label>رابط الهدية (اختياري)</label><input id="fl" dir="ltr" style="text-align:left" value="'+esc(g.link||'')+'">'+
    '<label>وين تنباع (اختياري)</label><input id="fs" maxlength="80" value="'+esc(g.store||'')+'">'+
    '<label>قصة الهدية (اختياري)</label><textarea id="fy" rows="3" maxlength="500">'+esc(g.story||'')+'</textarea><div class="err" id="er"></div>'+
    '<button class="btn" onclick="saveGift('+(m.id?'\''+m.id+'\'':'null')+')">حفظ</button><button class="btn alt" onclick="'+(m.id?'openGift(\''+m.id+'\')':'closeM()')+'">رجوع</button>';
  }else{
    var x=gOf(m.id);if(!x){return''}
    h+='<div style="font-size:64px;text-align:center">'+esc(x.emoji)+'</div><h2 style="text-align:center">'+esc(x.name)+'</h2><div style="text-align:center"><span class="price">'+fmt(x.price)+'</span></div>';
    if(x.store)h+='<p class="note">🛍️ '+esc(x.store)+'</p>';
    if(x.link)h+='<a class="btn alt" target="_blank" rel="noopener" href="'+esc(fixUrl(x.link))+'">🔗 فتح رابط الهدية</a>';
    if(x.story)h+='<div class="story">'+esc(x.story)+'</div>';
    if(S.data.mine){
      if(x.received&&(x.by||x.message))h+='<div class="ecard"><b>🎁 من '+esc(x.by||'مجهول')+'</b>'+(x.message?'<br>'+esc(x.message):'')+'</div>';
      else if(x.received)h+='<div class="ecard"><b>🎁 من شخص مجهول</b></div>';
      else if(x.reserved)h+='<div class="ecard">🎀 أحد حجزها لج! ما راح تعرفين منو إلا بعد ما تضغطين "استلمتها".</div>';
      h+=(x.reserved&&!x.received?'<button class="btn" onclick="markGot(\''+x.id+'\')">استلمتها 🎁 (اكشفي الاسم والكارت)</button>':'')+
      '<button class="btn alt" onclick="openForm(\''+x.id+'\')">✏️ تعديل</button><button class="btn danger" onclick="askDelGift(\''+x.id+'\')">'+(S.ask==='dg'?'اضغطي مرة ثانية للتأكيد':'🗑️ حذف')+'</button>';
    }else{
      var tok=lsGet('fmg_tok_'+x.id);
      if(x.received)h+='<div class="ecard">هذي الهدية انستلمت 🎁</div>';
      else if(x.reserved){
        h+='<div class="ecard">🔒 محجوزة'+(x.by?' من <b>'+esc(x.by)+'</b>':' (من شخص مجهول)')+' — تنتهي بعد '+leftTxt(x.until)+'</div>';
        if(tok)h+='<button class="btn alt" onclick="cancelRes(\''+x.id+'\')">إلغاء حجزي</button>';
      }else{
        h+='<label>اسمج (اختياري – اتركيه فاضي تبقين مجهولة)</label><input id="rn" maxlength="40" value="'+esc(lsGet('fmg_name')||'')+'">'+
        '<label>مدة الحجز</label><div class="seg" id="sg">'+[[24,'24 ساعة'],[48,'48 ساعة'],[168,'أسبوع']].map(function(a){return '<button class="'+(S.hours===a[0]?'on':'')+'" onclick="setHours('+a[0]+')">'+a[1]+'</button>'}).join('')+'</div>'+
        '<p class="mini">بعد انتهاء المدة ترجع الهدية متاحة للكل.</p>'+
        '<label>كارت إلكتروني لصاحبة الهدية (اختياري)</label><textarea id="rm" rows="2" maxlength="500" placeholder="اكتبي لها كلمة حلوة 💗"></textarea><div class="err" id="er"></div>'+
        '<button class="btn" onclick="reserve(\''+x.id+'\')">🎀 احجزي الهدية</button>';
      }
    }
    h+='<button class="btn alt" onclick="closeM()">إغلاق</button>';
  }
  return h+'</div></div>';
}
function setHours(n){S.hours=n;var b=document.querySelectorAll('#sg button');var v=[24,48,168];for(var i=0;i<b.length;i++)b[i].className=v[i]===n?'on':''}

function saveGift(id){
  var n=$('fn').value.trim();if(!n){$('er').textContent='اكتبي اسم الهدية';return}
  var pr=parseInt($('fp').value,10),row={name:n,emoji:($('fe').value.trim()||'🎁'),price:pr?pr*1000:null,link:$('fl').value.trim()||null,store:$('fs').value.trim()||null,story:$('fy').value.trim()||null};
  var q=id?sb.from('gifts').update(row).eq('id',id):sb.from('gifts').insert(Object.assign({list_id:S.data.list.id},row));
  q.then(function(r){if(r.error){$('er').textContent='صار خطأ: '+r.error.message;return}S.modal=null;toast('تم الحفظ 💗');loadList(S.data.list.id)})
}
function askDelGift(id){
  if(S.ask!=='dg'){S.ask='dg';vList();return}
  sb.from('gifts').delete().eq('id',id).then(function(r){S.ask='';S.modal=null;if(r.error)return toast('صار خطأ');toast('تم الحذف');loadList(S.data.list.id)})
}
function markGot(id){sb.from('gifts').update({received:true}).eq('id',id).then(function(r){if(r.error)return toast('صار خطأ');loadList(S.data.list.id)})}
function reserve(id){
  var nm=$('rn').value.trim(),msg=$('rm').value.trim();
  sb.rpc('reserve_gift',{p_gift:id,p_name:nm,p_message:msg,p_hours:S.hours}).then(function(r){
    if(r.error){var t=r.error.message||'';$('er').textContent=/taken/.test(t)?'أحد سبقج وحجزها 🙈':/owner/.test(t)?'ما تكدرين تحجزين هدية من قائمتج':'صار خطأ، جربي مرة ثانية';return}
    lsSet('fmg_tok_'+id,r.data);if(nm)lsSet('fmg_name',nm);toast('تم الحجز 🎀');loadList(S.data.list.id)
  })
}
function cancelRes(id){
  sb.rpc('cancel_reservation',{p_gift:id,p_token:lsGet('fmg_tok_'+id)}).then(function(){toast('تم إلغاء الحجز');loadList(S.data.list.id)})
}

function vMe(){
  var p=S.profile;
  setApp(topbar()+'<h2>حسابي</h2><label>اسمج</label><input id="dn" maxlength="30" value="'+esc(p.display_name)+'"><label>اليوزر</label><input id="un" dir="ltr" style="text-align:left" maxlength="20" value="'+esc(p.username)+'"><div class="err" id="er"></div>'+
  '<button class="btn" onclick="saveProfile()">حفظ</button><button class="btn alt" onclick="sb.auth.signOut().then(function(){S.profile=null;S.user=null;nav(\'/\')})">تسجيل خروج</button>');
}

/* ---------- تحميل البيانات والتنقل ---------- */
function loadList(id){
  sb.rpc('get_list',{p_id:id}).then(function(r){S.data=r.error?null:r.data;vList()})
}
function route(){
  if(!sb){vSetup();return}
  var p=location.hash.replace(/^#\/?/,'').split('/'),a=p[0]||'',b=p[1]||'';
  S.modal=null;S.ask='';
  if(a==='l'&&b){return loadList(b)}
  if(a==='u'&&b){
    sb.from('profiles').select('id,username,display_name').eq('username',b.toLowerCase()).maybeSingle().then(function(r){
      if(!r.data){S.pub=null;return vUser()}
      sb.from('lists').select('id,title,emoji').eq('owner',r.data.id).order('created_at',{ascending:false}).then(function(q){S.pub={profile:r.data,lists:q.data||[]};vUser()})
    });return
  }
  if(!S.user){
    if(!sessionStorage.getItem('fmg_sp')&&a===''){return vSplash()}
    return vAuth()
  }
  if(!S.profile){return vOnboard()}
  if(a==='new')return vNew();
  if(a==='me')return vMe();
  sb.from('lists').select('id,title,emoji').eq('owner',S.user.id).order('created_at',{ascending:false}).then(function(r){S.lists=r.data||[];vHome()})
}
function loadSession(cb){
  sb.auth.getSession().then(function(r){
    S.user=r.data&&r.data.session?r.data.session.user:null;
    if(!S.user){S.profile=null;return cb()}
    sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle().then(function(q){S.profile=q.data||null;cb()})
  })
}
if(sb){
  loadSession(route);
  sb.auth.onAuthStateChange(function(ev,ses){var id=ses&&ses.user?ses.user.id:null;if((ev==='SIGNED_IN'||ev==='SIGNED_OUT')&&id!==(S.user&&S.user.id))loadSession(route)});
  window.addEventListener('hashchange',route);
}else vSetup();
</script>
</body>
</html>
